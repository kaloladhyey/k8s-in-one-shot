kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: devopsbatches.trainwithdhyey.com
spec:
  group: trainwithdhyey.com
  names:
    plural: devopsbatches
    singular: devopsbatch
    kind: DevOpsBatch
    shortNames:
      - junoon
      - batches
      - twd
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
                description: "this is the name of devops batch"
              duration:
                type: string
                description: "this is the duration of devops batch"
              mode:
                type: string
                description: "this is the mode of the batch eg. live/recorded"
              plateform:
                type: string
                description: "this is the plateform of the batch" 
       
